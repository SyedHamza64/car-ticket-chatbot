[server]
headless = true
port = 8505
address = "0.0.0.0"
# Keep WebSocket connection alive (helps with "Connection error" after login)
websocketPingInterval = 45

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#6366f1"
base = "dark"
backgroundColor = "#05050a"
secondaryBackgroundColor = "#0c0c12"
textColor = "#f0f4ff"
font = "sans serif"
